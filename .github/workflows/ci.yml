name: TanAir CI/CD Quality Pipeline

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Format Check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Security Tests & Coverage (Vitest)
        run: npm run test:coverage
        env:
          NODE_ENV: test
          HERMES_GATEWAY_URL: https://dummy-hermes.tanair.my
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-test

      - name: Production Build (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          HERMES_GATEWAY_URL: https://dummy-hermes.tanair.my
